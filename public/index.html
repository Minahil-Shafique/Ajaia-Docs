<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajaia Docs</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#667085;--line:#e3e6ec;--accent:#2f5bea}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--text:#e8ebf1;--muted:#98a2b3;--line:#2b3240;--accent:#6d8cff}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;cursor:pointer}
main{max-width:860px;margin:24px auto;padding:0 16px}
button,.btn{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.row .t{flex:1}.muted{color:var(--muted);font-size:13px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.own{color:var(--accent);border-color:var(--accent)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#b42318;color:#fff;padding:10px 16px;border-radius:8px;display:none}
#title{font-size:22px;font-weight:600;border:0;background:transparent;color:var(--text);width:100%;padding:4px 0}
#editor{height:55vh;background:var(--card);color:var(--text)}
.ql-toolbar{background:var(--card);border-radius:8px 8px 0 0}.ql-container{border-radius:0 0 8px 8px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.users button{margin:4px}.hidden{display:none}
</style>
</head>
<body>
<header><h1 onclick="location.hash=''">Ajaia Docs</h1><span id="who" class="muted"></span><button id="logout" class="hidden">Switch user</button></header>
<main id="app"></main><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
const $ = (s) => document.querySelector(s), app = $('#app');
let me = JSON.parse(localStorage.getItem('me') || 'null'), quill, saveTimer, current;

async function api(method, url, body, isForm) {
  const headers = { 'x-user-id': me ? me.id : '' };
  if (body && !isForm) headers['content-type'] = 'application/json';
  const r = await fetch(url, { method, headers, body: isForm ? body : body && JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { toast(data.error || 'Request failed'); throw new Error(data.error); }
  return data;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3500); }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (d) => new Date(d.replace(' ', 'T') + 'Z').toLocaleString();

async function login() {
  const users = await api('GET', '/api/users');
  app.innerHTML = `<div class="card"><h2>Sign in</h2><p class="muted">Demo accounts (mocked auth). Pick one, then switch users to test sharing.</p>
  <div class="users">${users.map((u) => `<button data-id="${u.id}">${esc(u.name)} <span class="muted">${esc(u.email)}</span></button>`).join('')}</div></div>`;
  app.querySelectorAll('button').forEach((b) => b.onclick = () => {
    me = users.find((u) => u.id == b.dataset.id); localStorage.setItem('me', JSON.stringify(me)); route();
  });
}

async function dashboard() {
  const { owned, shared } = await api('GET', '/api/docs');
  const rows = (list, sharedList) => list.length ? list.map((d) => `<div class="row" data-id="${d.id}">
    <span class="t">${esc(d.title)}</span>
    ${sharedList ? `<span class="muted">from ${esc(d.owner_name)}</span><span class="badge">${d.role}</span>` : '<span class="badge own">owner</span>'}
    <span class="muted">${fmt(d.updated_at)}</span></div>`).join('') : '<p class="muted">Nothing here yet.</p>';
  app.innerHTML = `<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="primary" id="new">+ New document</button>
    <label class="btn">Upload .txt, .md or .docx<input id="file" type="file" accept=".txt,.md,.docx" hidden></label>
    <span class="muted">Uploads become new editable documents (max 2 MB).</span></div>
    <div class="card"><h3>My documents</h3>${rows(owned)}</div>
    <div class="card"><h3>Shared with me</h3>${rows(shared, true)}</div>`;
  app.querySelectorAll('.row').forEach((r) => r.onclick = () => location.hash = '#/doc/' + r.dataset.id);
  $('#new').onclick = async () => { const { id } = await api('POST', '/api/docs', {}); location.hash = '#/doc/' + id; };
  $('#file').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const fd = new FormData(); fd.append('file', f);
    const { id } = await api('POST', '/api/upload', fd, true); location.hash = '#/doc/' + id;
  };
}

async function editor(id) {
  current = await api('GET', '/api/docs/' + id);
  const canEdit = current.role !== 'viewer', isOwner = current.role === 'owner';
  app.innerHTML = `<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
    <button id="back">&larr; Back</button><span class="badge ${isOwner ? 'own' : ''}">${isOwner ? 'owner' : current.role + ' (owner: ' + esc(current.owner_name) + ')'}</span>
    <span id="status" class="muted" style="flex:1">${canEdit ? 'Saved' : 'Read only'}</span>
    ${isOwner ? '<button id="share">Share</button><button id="del">Delete</button>' : ''}</div>
    <input id="title" maxlength="200" ${canEdit ? '' : 'disabled'} value="${esc(current.title)}">
    <div id="toolbarwrap"></div><div id="editor"></div><div id="sharebox"></div>`;
  quill = new Quill('#editor', { theme: 'snow', readOnly: !canEdit, modules: { toolbar: canEdit ? [
    [{ header: [1, 2, 3, false] }], ['bold', 'italic', 'underline'], [{ list: 'ordered' }, { list: 'bullet' }], ['clean']] : false } });
  quill.clipboard.dangerouslyPasteHTML(current.content || '');
  $('#back').onclick = () => { flush(); location.hash = ''; };
  if (!canEdit) return;
  const queue = () => { $('#status').textContent = 'Saving...'; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 800); };
  quill.on('text-change', (d, o, src) => src === 'user' && queue());
  $('#title').oninput = queue;
  if (isOwner) { $('#del').onclick = async () => { if (confirm('Delete this document?')) { await api('DELETE', '/api/docs/' + id); location.hash = ''; } };
    $('#share').onclick = renderShare; }
}
async function flush() {
  if (!saveTimer || !current) return; clearTimeout(saveTimer); saveTimer = null;
  const title = $('#title') ? $('#title').value : current.title;
  try { await api('PATCH', '/api/docs/' + current.id, { title: title.trim() ? title : current.title, content: quill.root.innerHTML });
    const s = $('#status'); if (s) s.textContent = 'Saved'; } catch { const s = $('#status'); if (s) s.textContent = 'Save failed'; }
}
function renderShare() {
  $('#sharebox').innerHTML = `<div class="card" style="margin-top:16px"><h3>Share</h3>
    <div style="display:flex;gap:8px"><input id="em" placeholder="bob@example.com" style="flex:1"><select id="role"><option>editor</option><option>viewer</option></select><button class="primary" id="add">Share</button></div>
    <div id="people">${(current.shares || []).map((s) => `<div class="row"><span class="t">${esc(s.name)} <span class="muted">${esc(s.email)}</span></span><span class="badge">${s.role}</span><button data-u="${s.user_id}">Remove</button></div>`).join('') || '<p class="muted">Not shared yet.</p>'}</div></div>`;
  const reload = async () => { current = await api('GET', '/api/docs/' + current.id); renderShare(); };
  $('#add').onclick = async () => { await api('POST', `/api/docs/${current.id}/share`, { email: $('#em').value, role: $('#role').value }); reload(); };
  document.querySelectorAll('#people button').forEach((b) => b.onclick = async () => { await api('DELETE', `/api/docs/${current.id}/share/${b.dataset.u}`); reload(); });
}

async function route() {
  await flush();
  $('#who').textContent = me ? me.name : ''; $('#logout').classList.toggle('hidden', !me);
  if (!me) return login();
  try {
    const m = location.hash.match(/^#\/doc\/(\d+)/);
    m ? await editor(m[1]) : await dashboard();
  } catch { if (location.hash) location.hash = ''; }
}
$('#logout').onclick = () => { me = null; localStorage.removeItem('me'); location.hash = ''; route(); };
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', flush);
route();
</script>
</body>
</html>
